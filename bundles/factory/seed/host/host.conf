# This runner host's settings for setup.sh (z-sdlc factory bundle). Shell assignments, sourced by
# setup.sh as root, so keep this file code-owned like the script. Each has a default when unset;
# uncomment and set what this host needs. `bash .github/factory/host/setup.sh --print-settings` shows
# the result.

# The GitHub organization the runners register to (default: the checkout's origin owner).
#FACTORY_ORG=your-org
# Where the runner users' homes go (default /var/lib/factory); runners and images need tens of GB.
#RUNNER_HOME_BASE=/var/lib/factory
# Runner names: <prefix>-factory, <prefix>-planner (default: the short hostname).
#RUNNER_NAME_PREFIX=
# A LAN resolver jobs may use besides the local stub resolver 127.0.0.53 (default: none).
#LAN_DNS=
# Ports the isolation test must find closed on this host and the LAN (default: common service ports).
#PROBE_PORTS="22 80 443 3000 5432 6379 8000 8080"
# A database port the planning tier may reach on this host's own addresses (default: none; D3 rule 3).
#PLANNING_DB_PORT=

# Runners and limits per tier (defaults: strict 3, 8G/10G, 400%; planning 2, 4G/5G, 200%).
#STRICT_RUNNERS=3
#STRICT_MEMORY_HIGH=8G
#STRICT_MEMORY_MAX=10G
#STRICT_CPU_QUOTA=400%
#PLANNING_RUNNERS=2
#PLANNING_MEMORY_HIGH=4G
#PLANNING_MEMORY_MAX=5G
#PLANNING_CPU_QUOTA=200%
