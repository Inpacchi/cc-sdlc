# Common Data Modeling Mistakes
# Cross-cutting anti-patterns that appear across subject areas.
# Pattern-specific anti-patterns live in the pattern files.

id: common-modeling-mistakes
name: "Common Data Modeling Mistakes"
description: "Cross-cutting anti-patterns (premature concreteness, temporal blindness, implicit relationships) that recur across all data model subject areas."
pattern: gotchas
category: data-modeling
spec_relevant: false
project_applicability:
  relevant_when: "Project has a persistent data model (database, document store)"
  action_if_irrelevant: remove
last_updated: 2026-05-28

gotchas:
  - id: premature-concreteness
    severity: high
    symptom: "Multiple tables with near-identical structures but different names"
    cause: >
      Creating concrete tables (Customer, Vendor, Flight, Hotel) before identifying
      the abstract pattern (Party, Product) that unifies them.
    resolution: "Identify the common abstraction. Introduce the universal entity. Specialize via types and roles."
    prevention: "Before creating a new entity table, check if an existing abstract entity (Party, Product, Event) already covers the concept via type codes"
    name: "Modeling the specific before the general"
    silverston_insight: >
      "If you find yourself creating the third table that looks like the first two,
      stop. There's a pattern you haven't recognized yet."
    applies_to: "all subject areas"

  - id: type-as-table
    severity: high
    symptom: "Schema changes required every time the business adds a new category"
    cause: >
      Creating new tables for each subtype rather than using a type column or
      type catalog table. Leads to table proliferation and rigid schemas.
    resolution: "Use type catalog tables (RoleType, ProductType, EventType). New types = new rows."
    prevention: "When modeling a new category, ask: 'Will more categories appear later?' If yes, use a type table, not a new entity table"
    name: "Representing types as separate tables instead of type codes"
    silverston_insight: >
      "A new type of product, a new type of party, a new type of transaction —
      these should be data changes, not schema changes. If adding a category
      requires a DBA, your model is fighting the business."
    applies_to: "all subject areas"

  - id: temporal-blindness
    severity: critical
    symptom: "Cannot answer 'who was the account manager last quarter?'"
    cause: >
      Modeling only current state without from_date/thru_date on relationships,
      roles, and status changes. Loses history and makes auditing impossible.
    resolution: "Add from_date/thru_date to roles, relationships, and status assignments. Null thru_date = current."
    prevention: "For every relationship and role, ask: 'Will this ever change over time?' If yes, add temporal columns from the start"
    name: "Ignoring the time dimension"
    silverston_insight: >
      "Almost everything in business has a time dimension. Roles start and end.
      Relationships evolve. Prices change. Modeling only the present is modeling
      half the truth."
    applies_to: "all subject areas"

  - id: implicit-relationships
    severity: medium
    symptom: "The column name IS the only documentation of why two entities are linked"
    cause: >
      Using bare FK columns (manager_id, owner_id, assigned_to) instead of
      explicit relationship entities with type, role, and temporal context.
    resolution: "Extract into relationship entities (PartyRelationship, EntityRelationship) with typed roles."
    prevention: "When adding a FK column, ask: 'Could this relationship have a type, a time range, or metadata?' If yes, use a relationship entity"
    name: "Foreign keys without relationship semantics"
    silverston_insight: >
      "A foreign key tells you THAT two things are connected. A relationship entity
      tells you WHY, WHEN, and IN WHAT CAPACITY. The difference is the difference
      between a phone book and a social network."
    applies_to: "all subject areas"

  - id: status-as-column
    severity: high
    symptom: "Cannot answer 'when did this order move to shipped?' or 'how long was it pending?'"
    cause: >
      Using a status column (status VARCHAR) that gets overwritten on each change.
      Loses status history, transition timestamps, and who made the change.
    resolution: "StatusApplication pattern: separate table with status_type, from_date, applied_by. Current status = most recent."
    prevention: "When modeling status, default to a status history table. Only use a single column if you can prove history will never matter"
    name: "Status as a single mutable column"
    silverston_insight: >
      "Status isn't a property — it's a history. Every status change is an event
      worth recording."
    applies_to: "all subject areas"

  - id: multi-tenant-cte-isolation
    severity: critical
    symptom: "Recursive CTE returns rows belonging to other tenants; data leaks across tenant boundaries"
    cause: >
      Tenant filter is applied only on the anchor query of a recursive CTE. The
      recursive step joins from the previous level into new rows that may belong
      to other tenants — the filter is not inherited.
    resolution: "Apply the tenant_id filter on BOTH the anchor query AND the recursive step. Verify with EXPLAIN that the filter appears at every level."
    prevention: "In any iterated query (CTEs, repeated joins, graph traversals), audit that isolation holds at every hop, not just at the entry point"
    name: "Multi-tenant isolation gap in recursive CTEs"
    applies_to: "any multi-tenant schema with recursive queries or graph traversals"

  - id: left-join-on-vs-where
    severity: high
    symptom: "LEFT JOIN silently behaves as INNER JOIN; parent rows with no children disappear from results"
    cause: >
      Filter on the right table is placed in the WHERE clause instead of the ON
      clause. WHERE filters run after the join and remove NULL rows, turning the
      outer join into an inner join.
    resolution: "Move right-table filters from WHERE to the ON clause: LEFT JOIN child ON child.parent_id = parent.id AND child.tenant_id = ?."
    prevention: "During data-modeling review, check every LEFT JOIN for WHERE clauses that reference the right table. Each such clause is a potential semantic error."
    name: "LEFT JOIN filter placement: ON vs WHERE semantics"
    applies_to: "all SQL databases — especially multi-tenant queries with outer joins"

  - id: orm-onupdate-synchronize-session
    severity: medium
    symptom: "Bulk UPDATE with synchronize_session=False still bumps updated_at timestamps unexpectedly"
    cause: >
      In SQLAlchemy (and similar ORMs), synchronize_session=False only suppresses
      cache synchronization — it does NOT skip column-level onupdate hooks
      (e.g., updated_at = func.now()).
    resolution: "For true bypass of onupdate hooks (e.g., backfills), use raw SQL or set execution_options to skip compiled hooks. Verify with echo=True."
    prevention: "When writing bulk DML through an ORM, check generated SQL with echo=True to verify which hooks fire. Document any 'skip' flags that don't actually skip everything."
    name: "ORM onupdate hooks fire despite synchronize_session=False"
    applies_to: "SQLAlchemy and similar ORMs with column-level hooks"

  - id: idle-in-transaction-async
    severity: high
    symptom: "Connection killed mid-operation by idle_in_transaction_session_timeout; intermittent query failures in async code"
    cause: >
      In async runtimes, an implicit transaction is left open across an await
      boundary. The connection sits in idle-in-transaction state, vulnerable to
      timeout enforcement killing it mid-operation.
    resolution: "Wrap async work in an explicit async with session.begin(): block, or call session.commit() before any long-running async gap."
    prevention: "Review async code paths for await boundaries that span open transactions. Use explicit transaction blocks and commit before long-running awaits."
    name: "Idle-in-transaction timeout in async code"
    applies_to: "any async runtime with database transactions — especially Python asyncio with SQLAlchemy async"
